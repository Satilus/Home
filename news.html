<style>
:root{color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--ink:#000;--ink2:#3A3A3C;--muted:#6C6C70;--sep:#D1D1D6;--seg:#E3E3E8;--segOn:#FFFFFF;--fill:#EFEFF4;
  --tint:#E0261C;--green:#34C759;--star:#FF9F0A;--sheet:#F2F2F7}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--ink:#FFF;--ink2:#D1D1D6;--muted:#98989F;--sep:#38383A;--seg:#2C2C2E;--segOn:#636366;--fill:#2C2C2E;--tint:#FF453A;--green:#30D158;--sheet:#1C1C1E}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
header > div:first-child{flex:1;min-width:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--tint);display:inline-flex;align-items:center;justify-content:center;border-radius:22px}
.iconbtn.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;padding:2px;border-radius:9px;background:var(--seg);max-width:440px;margin-bottom:16px}
.seg button{flex:1;min-height:36px;border:0;border-radius:7px;background:transparent;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--segOn);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.hero{display:block;border-radius:24px;overflow:hidden;position:relative;margin-bottom:14px;background:var(--card);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.hero:active,.nrow:active{transform:scale(.98)}
.hero .img{aspect-ratio:16/10;background:linear-gradient(135deg,#E0261C,#7B2FF7)}
.hero .img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.hero .img img.ok,.nrow .th img.ok{opacity:1}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 16px;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82))}
.hero h2{margin:0 0 6px;font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero .meta{color:rgba(255,255,255,.8)}
.meta{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap}
.nrow{display:flex;gap:12px;padding:10px;border-radius:20px;margin-bottom:10px;background:var(--card);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.nrow .th{flex:none;width:96px;height:96px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#E0261C,#7B2FF7)}
.nrow .th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.nrow .bd{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.nrow h3{margin:0;font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nrow p{margin:0;font-size:13px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:12px;color:var(--muted);text-align:center;margin:18px 0;line-height:1.5}
.empty{padding:24px;border-radius:18px;background:var(--card);color:var(--muted);text-align:center}
.skel{border-radius:20px;height:116px;margin-bottom:10px;background:linear-gradient(90deg,var(--card),var(--fill),var(--card));background-size:200% 100%;animation:sk 1.2s ease infinite}
.skel.big{height:240px;border-radius:24px}@keyframes sk{to{background-position:-200% 0}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tabbar nav{display:flex;width:100%;max-width:520px;justify-content:space-around}
.tabbar a{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;text-decoration:none;font-size:10px;font-weight:600;color:var(--muted)}
.tabbar a[aria-current=page]{color:var(--tint)}
</style>

</head>
<body>
<div class="wrap">

    <div><div class="eyebrow" id="upd">Тю і Шо глянемо</div><h1>Новини</h1></div>

  </header>
  <div class="seg" role="group" aria-label="Регіон" id="region"></div>
  <div id="feed" aria-live="polite"><div class="skel big"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <p class="note" id="foot"></p>
</div>

</nav></div>
