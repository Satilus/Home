name: Стрічка новин кіно
on:
  schedule:
    - cron: '41 */2 * * *'   # кожні дві години
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/scripts/news.mjs', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
      - name: Зібрати новини
        run: node .github/scripts/news.mjs
      - name: Опублікувати в гілку news-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b news-data
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git commit -q -m "Новини $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" news-data
