name: Автотести
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/scripts/**', '.github/workflows/news.yml', '.github/workflows/new-episodes.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Встановити Playwright (без завантаження браузерів — використовуємо системний Chrome)
        run: pip install --disable-pip-version-check playwright==1.63.0
      - name: Запустити сайт локально
        run: python3 -m http.server 8765 >/dev/null 2>&1 &
      - name: Автотест (171 перевірка на трьох iPhone)
        env:
          BASE: http://localhost:8765/
          AUDIT_OUT: ${{ runner.temp }}/audit
          CHROME: /usr/bin/google-chrome
        run: python3 .github/tests/audit.py
      - name: Знімки екранів (якщо щось провалилось)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: audit-screenshots
          path: ${{ runner.temp }}/audit
          retention-days: 7
