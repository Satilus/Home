name: Сповіщення про нові серії
on:
  schedule:
    - cron: '23 * * * *'   # щогодини
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: new-episodes
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # дії закріплені за точним комітом (не за тегом), щоб їх не можна було непомітно підмінити
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
      - name: Встановити web-push (точна версія, без скриптів встановлення)
        run: npm install --no-audit --no-fund --ignore-scripts --prefix .github/scripts web-push@3.6.7
      - name: Перевірити нові серії й надіслати сповіщення
        run: node .github/scripts/notify.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
