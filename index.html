<meta name="application-name" content="Тю і Шо глянемо">

<script src="phrases.js?v=20"></script>
<style>
:root{color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--ink:#000;--ink2:#3A3A3C;--muted:#6C6C70;--sep:#D1D1D6;--seg:#E3E3E8;--segOn:#FFFFFF;--fill:#EFEFF4;
  --tint:#E0261C;--green:#34C759;--star:#FF9F0A;--sheet:#F2F2F7}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--ink:#FFF;--ink2:#D1D1D6;--muted:#98989F;--sep:#38383A;--seg:#2C2C2E;--segOn:#636366;--fill:#2C2C2E;--tint:#FF453A;--green:#30D158;--sheet:#1C1C1E}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.splashing{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
h1{margin:0;font-size:clamp(24px,7.4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
header > div:first-child{flex:1;min-width:0}
h2.sec{margin:26px 0 10px;font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.sec a{font-size:15px;font-weight:600;color:var(--tint);text-decoration:none}
.quote{position:relative;margin:4px 0 0;padding:16px 18px;border-radius:16px;background:var(--card);font-size:17px;line-height:1.45;font-weight:600}
.quote small{display:block;margin-top:6px;font-size:12px;font-weight:600;color:var(--muted)}
.quote button{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:18px;background:transparent;color:var(--muted)}
.stats{display:flex;justify-content:space-around;align-items:center;margin-top:10px;padding:10px 8px;border-radius:14px;background:var(--card);font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.stats b{color:var(--ink);font-size:17px;font-weight:800;margin-right:4px}
.stats i{width:.5px;align-self:stretch;background:var(--sep)}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:128px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;text-decoration:none;position:relative}
.poster{width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.14);background:#888}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.poster img.ok{opacity:1}
.ct{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:12px;color:var(--muted);margin-top:-3px}
.add{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:17px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.add[disabled]{background:var(--green);font-size:16px}
.pick{display:flex;gap:16px;padding:14px;border-radius:16px;background:var(--card);align-items:center}
.pick .poster{width:96px;flex:none}
.pick h3{margin:0 0 4px;font-size:19px;font-weight:800;line-height:1.2}
.pick p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:38px;padding:0 14px;border:0;border-radius:10px;background:var(--fill);font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}
.btn.go{background:var(--tint);color:#fff}
.seg{display:flex;padding:2px;border-radius:9px;background:var(--seg);max-width:440px;margin-bottom:12px}
.seg[hidden]{display:none}
.seg button{flex:1;min-height:32px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--segOn);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}
.empty{padding:20px;border-radius:14px;background:var(--card);color:var(--muted);font-size:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:14px;background:rgba(30,30,32,.94);color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tabbar nav{display:flex;width:100%;max-width:520px;justify-content:space-around}
.tabbar a{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;text-decoration:none;font-size:10px;font-weight:600;color:var(--muted)}
.tabbar a[aria-current=page]{color:var(--tint)}


.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--tint);display:inline-flex;align-items:center;justify-content:center;border-radius:22px}
.set{padding:14px 16px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.set h3{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.set p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}.set a{color:var(--tint)}
.steps{margin:0;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.5;display:flex;flex-direction:column;gap:4px}
.set input{min-height:44px;border:0;border-radius:12px;background:var(--fill);padding:0 12px;font:inherit;font-size:16px;color:inherit}
.nws{display:flex;flex-direction:column;gap:8px}
.nw{display:flex;gap:12px;align-items:center;padding:8px;border-radius:18px;text-decoration:none;transition:transform .3s cubic-bezier(.32,.72,0,1)}
.nw:active{transform:scale(.98)}
.nw .th{flex:none;width:72px;height:56px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#E0261C,#7B2FF7)}
.nw .th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.nw .th img.ok{opacity:1}
.nw b{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:12px}
.act{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:22px;border:0;min-height:76px;transition:transform .35s cubic-bezier(.32,.72,0,1)}
.act:active{transform:scale(.97)}
.act b{display:block;font-size:15px;font-weight:700;line-height:1.2}
.act small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.act-e{font-size:28px;line-height:1}
.act-main{background:linear-gradient(135deg,rgba(224,38,28,.92),rgba(255,120,60,.88))!important;color:#fff}
.act-main small{color:rgba(255,255,255,.85)}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:18px;text-decoration:none}
.ep .poster{width:44px;flex:none;border-radius:10px!important;font-size:13px}
.ep span{flex:1;display:flex;flex-direction:column}.ep b{font-size:15px}.ep small{font-size:13px;color:var(--muted)}
.ep em{font-style:normal;font-size:13px;font-weight:700;color:var(--tint);white-space:nowrap}.ep em.out{color:var(--green)}
/* аркуш */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.backdrop{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.3)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:10px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto}
.done{min-height:44px;border:0;background:transparent;color:var(--tint);font-size:17px;font-weight:600;padding:0 4px}
.lbl{font-size:13px;color:var(--muted)}
.wz-top{display:flex;justify-content:space-between;align-items:center}
.wz-dots{display:flex;gap:6px}.wz-dots i{width:22px;height:5px;border-radius:3px;background:var(--sep);transition:background .3s}.wz-dots i.on{background:var(--tint)}
.wz-q{margin:2px 0 4px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.wz-opts{display:flex;flex-direction:column;gap:8px}
.wz-o{display:flex;align-items:center;gap:14px;min-height:58px;padding:0 16px;border-radius:18px;border:.5px solid var(--glass-edge,transparent);background:var(--glass,var(--card));font-size:17px;font-weight:600;text-align:left;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s}
.wz-o:active{transform:scale(.97)}.wz-o.pick-on{background:var(--tint);color:#fff;transform:scale(1.02)}
.wz-e{font-size:26px}
.wz-res{display:flex;flex-direction:column;gap:10px}
.wz-card{display:flex;gap:14px;align-items:center;padding:10px;border-radius:20px;background:var(--glass,var(--card));border:.5px solid var(--glass-edge,transparent);text-decoration:none;animation:rvIn .5s cubic-bezier(.32,.72,0,1) both}
.wz-card:nth-child(2){animation-delay:.08s}.wz-card:nth-child(3){animation-delay:.16s}
.wz-card .poster{width:70px;flex:none}.wz-card.top .poster{width:96px}
.wz-card span{display:flex;flex-direction:column;gap:3px}.wz-card b{font-size:17px}.wz-card small{font-size:13px;color:var(--muted)}
.wz-card em{font-style:normal;font-size:12px;font-weight:700;color:var(--tint)}
.yr{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:26px;color:#fff;background:linear-gradient(150deg,#E0261C,#7B2FF7 60%,#0B0B1A);box-shadow:0 14px 40px rgba(123,47,247,.35)}
.yr-big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em}.yr-sub{font-size:17px;font-weight:600;opacity:.85;margin-top:-4px}
.yr-num b{font-size:88px;font-weight:800;line-height:1;display:block}.yr-num span{font-size:16px;font-weight:600;opacity:.85}
.yr-grid{display:flex;flex-wrap:wrap;gap:8px}.yr-grid span{padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.16);font-size:13px;font-weight:600}.yr-grid b{font-size:17px;margin-right:5px}
.yr-line{font-size:15px;opacity:.95}
.yr .row .ct{color:#fff}
@keyframes rvIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

/* ================= заставка ================= */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;color:#fff;cursor:pointer;transition:opacity .8s ease,transform .8s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-in{position:relative;z-index:2;max-width:min(860px,92vw);padding:24px;text-align:center}
.sp-cap{font:600 11px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:0;animation:capIn 1s .2s forwards;margin-bottom:22px}
@keyframes capIn{to{opacity:.6}}
.sp-q{font-size:clamp(26px,6.4vw,58px);line-height:1.18}
.sp-q span{display:inline-block;white-space:pre}
.sp-skip{position:absolute;z-index:3;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:500 12px -apple-system,system-ui,sans-serif;opacity:0;animation:capIn 1s 2.5s forwards}
.cursor{display:inline-block;width:.55em;height:1em;vertical-align:-.12em;background:currentColor;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Матриця */
.th-matrix{background:#000!important}
.th-matrix .sp-q{color:#5CFF7A;text-shadow:0 0 12px rgba(92,255,122,.7);font-size:clamp(22px,5vw,44px);text-align:left}
.th-matrix .sp-cap,.th-matrix .sp-skip{color:#5CFF7A}
/* Космос */
.th-space{background:#000!important;perspective:340px}
.th-space .sp-in{position:absolute;bottom:0;transform-origin:50% 100%;transform:rotateX(26deg);max-width:min(640px,90vw)}
.th-space .sp-q{color:#FFE81F;font-size:clamp(26px,6vw,48px);letter-spacing:.02em;text-align:center;animation:crawl 12s linear forwards}
.th-space .sp-in .sp-cap{display:none}
.sp-top{position:absolute;z-index:3;top:calc(26px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#FFE81F}
@keyframes crawl{from{transform:translateY(15vh)}to{transform:translateY(-115vh)}}
/* Нуар */
.th-noir{background:radial-gradient(ellipse at 30% 40%,#3a3a3a,#050505 70%)!important;filter:grayscale(1)}
.th-noir::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 26px,rgba(0,0,0,.55) 26px 46px);opacity:.7;z-index:1}
.th-noir .sp-q{font-style:italic;color:#eee;text-shadow:0 2px 18px #000}
.th-noir .sp-q span{opacity:0;animation:noirIn .9s forwards}
@keyframes noirIn{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
/* Жахи */
.th-horror{background:radial-gradient(circle at 50% 55%,#1a0000,#000 70%)!important}
.th-horror .sp-q{color:#ff2a2a;text-shadow:0 0 6px #ff0000,0 0 24px rgba(255,0,0,.6);animation:flicker 3.2s infinite}
.th-horror .sp-q span{opacity:0;animation:horrorIn .5s forwards}
.th-horror .sp-cap,.th-horror .sp-skip{color:#ff6b6b}
@keyframes horrorIn{0%{opacity:0;transform:translateY(-18px) scaleY(1.4)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
/* Кіберпанк */
.th-cyber{background:linear-gradient(160deg,#0b0221,#1b0638 55%,#00121f)!important}
.th-cyber::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);z-index:1}
.th-cyber .sp-q{color:#fff;text-shadow:-2px 0 #ff2bd6,2px 0 #00f0ff,0 0 22px rgba(255,43,214,.6)}
.th-cyber .sp-q span{opacity:0;animation:glitchIn .45s forwards}
.th-cyber .sp-cap{color:#00f0ff}
@keyframes glitchIn{0%{opacity:0;transform:translateX(-12px) skewX(30deg)}40%{opacity:1;transform:translateX(6px) skewX(-15deg)}70%{transform:translateX(-3px)}100%{opacity:1;transform:none}}
/* Піксель */
.th-pixel{background:#1d2b53!important;image-rendering:pixelated}
.th-pixel .sp-in{border:6px solid #fff;box-shadow:0 0 0 6px #000,inset 0 0 0 6px #000;background:#29366f;padding:28px 22px}
.th-pixel .sp-q{font-size:clamp(14px,3.2vw,24px);line-height:1.7;color:#fff1e8}
.th-pixel .sp-cap{color:#ffec27}
/* Вестерн */
.th-western{background:linear-gradient(180deg,#e8b26a,#b5651d 60%,#5a2e0e)!important;color:#2b1400}
.th-western .sp-q{color:#3a1a02;text-shadow:0 2px 0 rgba(255,220,160,.5)}
.th-western .sp-q span{opacity:0;animation:dropIn .7s cubic-bezier(.3,1.6,.5,1) forwards}
.th-western .sp-cap,.th-western .sp-skip{color:#3a1a02}
@keyframes dropIn{from{opacity:0;transform:translateY(-60px) rotate(-6deg)}to{opacity:1;transform:none}}
/* Німе кіно */
.th-silent{background:#0d0d0d!important;animation:proj .15s infinite}
.th-silent .sp-in{border:2px solid #d8d2c0;outline:1px solid #d8d2c0;outline-offset:6px;padding:34px 30px;max-width:min(700px,86vw)}
.th-silent .sp-q{color:#efe9d6;font-style:italic;opacity:0;animation:silentIn 1.6s .5s forwards}
.th-silent .sp-cap{color:#efe9d6}
@keyframes silentIn{to{opacity:1}}
@keyframes proj{0%,100%{filter:brightness(1)}50%{filter:brightness(.88)}}
/* Магія */
.th-magic{background:radial-gradient(ellipse at 50% 30%,#1f2a4a,#07080f 70%)!important}
.th-magic .sp-q{color:#ffe3a3;text-shadow:0 0 10px rgba(255,200,90,.75),0 0 28px rgba(255,170,60,.45)}
.th-magic .sp-q span{opacity:0;animation:magicIn .9s forwards}
.th-magic .sp-cap{color:#ffe9a8}
@keyframes magicIn{from{opacity:0;filter:blur(10px);transform:scale(1.4)}to{opacity:1;filter:none;transform:none}}
/* Аніме */
.th-anime{background:radial-gradient(circle,#fff 0,#ffe4ef 40%,#ff7eb6 100%)!important;color:#1a1a1a}
.th-anime .sp-q{color:#111;font-weight:900;-webkit-text-stroke:1px #111;text-shadow:4px 4px 0 #ff2f8f}
.th-anime .sp-q span{opacity:0;animation:punch .38s cubic-bezier(.2,1.8,.4,1) forwards}
.th-anime .sp-cap,.th-anime .sp-skip{color:#111}
@keyframes punch{from{opacity:0;transform:scale(2.4) rotate(-8deg)}to{opacity:1;transform:none}}
/* Комікс */
.th-comic{background:#ffd60a radial-gradient(#e63946 1.6px,transparent 1.8px) 0 0/14px 14px!important;color:#000}
.th-comic .sp-in{background:#fff;border:4px solid #000;border-radius:28px;box-shadow:8px 8px 0 #000;padding:26px 24px;max-width:min(680px,88vw)}
.th-comic .sp-q{color:#000;font-size:clamp(20px,4.6vw,38px);text-transform:uppercase}
.th-comic .sp-q span{opacity:0;animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.th-comic .sp-cap,.th-comic .sp-skip{color:#000}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(12deg)}to{opacity:1;transform:none}}
/* VHS */
.th-vhs{background:linear-gradient(180deg,#120027,#2b0a3d 60%,#ff6a3d)!important;animation:track 4s infinite}
.th-vhs::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);z-index:1}
.th-vhs::after{content:"▶ PLAY";position:absolute;top:calc(20px + env(safe-area-inset-top));left:22px;font:700 20px "Unbounded",monospace;color:#fff;text-shadow:2px 0 #f0f,-2px 0 #0ff;z-index:3}
.th-vhs .sp-q{font-style:italic;color:#fff;text-shadow:3px 0 #ff00c8,-3px 0 #00e5ff;opacity:0;animation:vhsIn 1.2s .4s forwards}
.th-vhs .sp-cap{color:#ffd6f5}

.th-dune{background:linear-gradient(180deg,#2a1608,#a9622a 55%,#e3a35b)!important}

.th-romcom{background:#fffaf2 repeating-linear-gradient(180deg,transparent 0 33px,#d7e4f2 33px 34px)!important;color:#2a2a2a}

/* Космос-2 */
.th-cosmos{background:#000!important}
.th-cosmos .ring{position:absolute;z-index:1;width:min(70vw,520px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 60px 18px rgba(255,190,110,.55),inset 0 0 50px 10px rgba(255,170,80,.45);border:3px solid rgba(255,230,190,.8);animation:breathe 6s ease-in-out infinite}
.th-cosmos .ring::after{content:"";position:absolute;left:-30%;right:-30%;top:48%;height:4%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,220,170,.9),transparent);filter:blur(2px)}
.th-cosmos .sp-q{color:#f5efe6;letter-spacing:.06em;font-weight:300;text-shadow:0 0 18px #000}
.th-cosmos .sp-q span{opacity:0;animation:noirIn 1.6s forwards}
@keyframes breathe{50%{transform:scale(1.04)}}

.th-tale{background:radial-gradient(ellipse at 50% 100%,#2b4f8a,#0b1630 70%)!important}
.th-tale .sp-q{color:#fff7d6;font-size:clamp(34px,8vw,72px);font-weight:700;text-shadow:0 0 16px rgba(255,240,180,.5)}
.th-tale .sp-q span{opacity:0;animation:bounceIn .7s cubic-bezier(.3,1.7,.5,1) forwards}

@keyframes bounceIn{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}

}
