<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нумізматика · Тю і Шо</title>
<meta name="apple-mobile-web-app-title" content="Тю і Шо">
<meta name="application-name" content="Тю і Шо">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--ink:#000;--ink2:#3A3A3C;--muted:#6C6C70;--sep:#D1D1D6;--seg:#E3E3E8;--segOn:#FFFFFF;--fill:#EFEFF4;
  --tint:#E0261C;--green:#34C759;--gold:#B8860B;--sheet:#F2F2F7;--plate:#F7F6F2}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--ink:#FFF;--ink2:#D1D1D6;--muted:#98989F;--sep:#38383A;--seg:#2C2C2E;--segOn:#636366;--fill:#2C2C2E;--tint:#FF453A;--green:#30D158;--gold:#E0B04A;--sheet:#1C1C1E;--plate:#232325}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--tint);display:inline-flex;align-items:center;justify-content:center;border-radius:22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{padding:14px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.seg{display:flex;padding:2px;border-radius:9px;background:var(--seg);max-width:440px}
.seg button{flex:1;min-height:32px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--segOn);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 18px}
.field{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:10px;background:var(--seg);flex:1 1 220px}
.field input{flex:1;min-height:40px;border:0;background:transparent;font-size:16px;outline:none}
.sortsel{min-height:40px;padding:0 10px;border:0;border-radius:10px;background:var(--seg);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}
.item{position:relative}
.open{width:100%;padding:0;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:8px}
.plate{width:100%;aspect-ratio:1/1;border-radius:16px;background:var(--plate);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.coin{width:78%;aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;color:#5b4a1e;background:#E7D7A8;box-shadow:inset 0 0 0 5px #D4C08A,0 4px 10px rgba(0,0,0,.18);padding:10px}
.plate img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;opacity:0;transition:opacity .3s;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.plate img.ok{opacity:1}
.qty{position:absolute;left:8px;top:8px;min-width:30px;height:24px;padding:0 8px;border-radius:12px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ttl{font-size:15px;font-weight:600;line-height:1.25;padding:0 2px}
.sub{font-size:13px;color:var(--muted);padding:0 2px;margin-top:-4px}
.buy{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.empty{padding:28px 20px;border-radius:16px;background:var(--card);color:var(--muted);text-align:center;line-height:1.5}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.backdrop{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.38)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;background:var(--sheet);padding:10px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.plate img{transition:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.done{min-height:44px;border:0;background:transparent;color:var(--tint);font-size:17px;font-weight:600;padding:0 4px}
.lbl{font-size:13px;color:var(--muted)}
.hero .plate{max-width:280px;margin:0 auto;border-radius:20px}
.hero h2{margin:12px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15;text-align:center}
.hero .lbl{text-align:center;display:block}
.sides{display:flex;justify-content:center;margin-top:10px}
.group{border-radius:14px;background:var(--card);overflow:hidden}
.group .r{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:8px 16px;border-bottom:.5px solid var(--sep);font-size:15px}
.group .r:last-child{border-bottom:0}
.group .r span:last-child{color:var(--muted);text-align:right}
.box{padding:14px 16px;border-radius:14px;background:var(--card)}
.box h3{margin:0 0 6px;font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.box p{margin:0;font-size:15px;line-height:1.5;white-space:pre-line}
.stepper{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.stepper button{width:44px;height:36px;border:0;border-radius:7px;background:transparent;font-size:20px}
.big{min-height:50px;border-radius:14px;border:0;font-size:17px;font-weight:600}
.big.go{background:var(--green);color:#fff}
.big.back{background:var(--card);color:var(--tint)}
.big.plain{background:transparent;color:var(--muted);font-size:15px;min-height:44px}
.form{border-radius:14px;background:var(--card);overflow:hidden}
.form label{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:.5px solid var(--sep);font-size:15px}
.form label:last-child{border-bottom:0}
.form label span{width:96px;flex:none;color:var(--ink2)}
.form input,.form select,.form textarea{flex:1;min-height:44px;border:0;background:transparent;font-size:16px;outline:none;padding:0}
.form textarea{min-height:90px;padding:12px 0;resize:vertical}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pick button{aspect-ratio:1/1;border-radius:12px;border:2px solid transparent;background:var(--plate);padding:4px;overflow:hidden}
.pick button[aria-pressed=true]{border-color:var(--tint)}
.pick img{width:100%;height:100%;object-fit:contain}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:8px 8px 8px 16px;border-radius:14px;background:rgba(30,30,32,.94);color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast button{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tabbar nav{display:flex;width:100%;max-width:520px;justify-content:space-around}
.tabbar a{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;text-decoration:none;font-size:10px;font-weight:600;color:var(--muted)}
.tabbar a[aria-current=page]{color:var(--tint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.stat b{font-size:24px}.stat{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">Тю і Шо</div><h1>Нумізматика</h1></div>
    <button class="iconbtn" id="btnAdd" aria-label="Додати монету"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg></button>
  </header>

  <div class="stats" id="stats"></div>
  <div class="seg" role="group" aria-label="Список" id="tabs"></div>
  <div class="tools">
    <div class="field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><label for="q" class="sr">Пошук</label><input id="q" type="search" placeholder="Пошук за назвою, роком, серією" autocomplete="off"></div>
    <label for="sort" class="sr">Сортування</label>
    <select id="sort" class="sortsel"><option value="year">За роком</option><option value="name">За назвою</option><option value="added">Нещодавно додані</option></select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="foot">Зображення монет: Національний банк України, Wikimedia Commons та інші відкриті джерела — підтягуються з першоджерел.</div>
</div>

<div class="overlay" id="ov" hidden>
  <button class="backdrop" id="ovBg" aria-label="Закрити"></button>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div class="tabbar"><nav aria-label="Розділи">
  <a href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"></rect><path d="M10 9.5v6l5-3z"></path></svg>Кінотеатр</a>
  <a href="coins.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5.5"></circle><path d="M12 9.5v5M10.3 11h3.4"></path></svg>Нумізматика</a>
</nav></div>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo">Скасувати</button></div>

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const fmtN = n => (n == null || n === '') ? '' : (isNaN(Number(String(n).replace(/\s/g,''))) ? String(n) : Number(String(n).replace(/\s/g,'')).toLocaleString('uk-UA'));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c); };
const CART = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* Стартовий список: заповнюється з твого переліку. Поля:
   id, status ('have' | 'want'), name, country, year, nominal, metal, weight, diameter, mintage, series, history, img, imgBack, imgSource, qty */
const SEED = [];

let removed = store.get('coins.removed', []);
let items = store.get('coins.items', null) || [];
SEED.forEach(sd => { if (!items.some(i => i.id === sd.id) && !removed.includes(sd.id)) items.push(Object.assign({ qty: sd.status === 'have' ? 1 : 0, added: 0 }, sd)); });
let ui = Object.assign({ tab:'have', sort:'year', q:'' }, store.get('coins.ui', {}));
const save = () => { store.set('coins.items', items); store.set('coins.ui', { tab: ui.tab, sort: ui.sort }); };

/* ---------- рендер ---------- */
function coinVisual(it, big){
  const ph = `<span class="coin" style="${big ? 'font-size:28px' : ''}">${esc(it.nominal || it.name.split(' ')[0] || '•')}</span>`;
  const src = big && ui.side === 'back' && it.imgBack ? it.imgBack : it.img;
  return `<span class="plate">${ph}${src ? `<img alt="" loading="lazy" referrerpolicy="no-referrer" src="${esc(src)}" onload="this.classList.add('ok')" onerror="this.remove()">` : ''}${!big && it.status === 'have' && (it.qty || 1) > 1 ? `<span class="qty">×${it.qty}</span>` : ''}</span>`;
}
function render(){
  const have = items.filter(i => i.status === 'have'), want = items.filter(i => i.status === 'want');
  const pieces = have.reduce((s, i) => s + (Number(i.qty) || 1), 0);
  $('#stats').innerHTML = `
    <div class="stat"><b>${pieces}</b><span>${plural(pieces,'монета','монети','монет')} у колекції</span></div>
    <div class="stat"><b>${have.length}</b><span>${plural(have.length,'позиція','позиції','позицій')}</span></div>
    <div class="stat"><b>${want.length}</b><span>хочу придбати</span></div>`;
  $('#tabs').innerHTML = `<button data-tab="have" aria-pressed="${ui.tab==='have'}">Колекція ${have.length}</button><button data-tab="want" aria-pressed="${ui.tab==='want'}">Хочу придбати ${want.length}</button>`;
  $('#sort').value = ui.sort;
  const q = ui.q.trim().toLowerCase();
  let shown = items.filter(i => i.status === ui.tab && (!q || [i.name, i.year, i.series, i.country, i.nominal, i.metal].join(' ').toLowerCase().includes(q)));
  shown.sort(ui.sort === 'name' ? (a,b) => a.name.localeCompare(b.name,'uk') : ui.sort === 'added' ? (a,b) => (b.added||0) - (a.added||0) : (a,b) => (String(b.year)).localeCompare(String(a.year)) || a.name.localeCompare(b.name,'uk'));
  $('#grid').innerHTML = shown.map(it => `
    <div class="item">
      <button class="open" data-open="${esc(it.id)}" aria-label="${esc(it.name)}">${coinVisual(it)}<span class="ttl">${esc(it.name)}</span><span class="sub">${esc([it.year, it.nominal].filter(Boolean).join(' · '))}</span></button>
      ${it.status === 'want' ? `<button class="buy" data-buy="${esc(it.id)}" aria-label="Придбано: перенести «${esc(it.name)}» в колекцію">${CART}</button>` : ''}
    </div>`).join('');
  const emptyText = q ? 'Нічого не знайдено' : (ui.tab === 'have' ? 'Колекція поки порожня. Натисни «+», щоб додати монету.' : 'Список бажаного порожній. Натисни «+», щоб додати монету, яку хочеш придбати.');
  $('#empty').hidden = shown.length > 0; $('#empty').textContent = emptyText;
}

/* ---------- статуси й скасування ---------- */
let undoSnap = null, toastT;
function toast(text){ $('#toastText').textContent = text; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('#toast').hidden = true, 4500); }
function mutate(fn, msg){ undoSnap = JSON.stringify(items); fn(); save(); render(); if (msg) toast(msg); if (!$('#ov').hidden && $('#ov').dataset.id) openSheet($('#ov').dataset.id); }
const byId = id => items.find(i => i.id === id);
const setStatus = (id, st) => { const it = byId(id); mutate(() => { it.status = st; if (st === 'have' && !it.qty) it.qty = 1; }, st === 'have' ? `«${it.name}» → у колекції` : `«${it.name}» → хочу придбати`); };
$('#toastUndo').onclick = () => { if (undoSnap) { items = JSON.parse(undoSnap); undoSnap = null; save(); render(); if (!$('#ov').hidden && $('#ov').dataset.id) openSheet($('#ov').dataset.id); } $('#toast').hidden = true; };

/* ---------- картка монети ---------- */
function openSheet(id){
  const it = byId(id); if (!it) return closeSheet();
  const rows = [['Країна', it.country], ['Рік', it.year], ['Номінал', it.nominal], ['Метал', it.metal], ['Маса', it.weight], ['Діаметр', it.diameter], ['Тираж', fmtN(it.mintage)], ['Серія', it.series]].filter(r => r[1]);
  $('#sheet').setAttribute('aria-label', it.name);
  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <div class="row"><span class="lbl">${it.status === 'have' ? 'У колекції' : 'Хочу придбати'}</span><button class="done" data-close>Готово</button></div>
    <div class="hero">${coinVisual(it, true)}
      ${it.imgBack ? `<div class="sides"><div class="seg" role="group" aria-label="Сторона" style="width:220px"><button data-side="front" aria-pressed="${ui.side !== 'back'}">Аверс</button><button data-side="back" aria-pressed="${ui.side === 'back'}">Реверс</button></div></div>` : ''}
      <h2>${esc(it.name)}</h2>
      ${it.imgSource ? `<span class="lbl">Зображення: ${esc(it.imgSource)}</span>` : ''}
    </div>
    ${rows.length ? `<div class="group">${rows.map(r => `<div class="r"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}</div>` : ''}
    ${it.history ? `<div class="box"><h3>Історія</h3><p>${esc(it.history)}</p></div>` : ''}
    ${it.note ? `<div class="box"><h3>Нотатка</h3><p>${esc(it.note)}</p></div>` : ''}
    ${it.status === 'have' ? `<div class="row box" style="padding:8px 8px 8px 16px"><span>Кількість: <b>${it.qty || 1}</b></span><div class="stepper"><button data-qty="-1" aria-label="Менше">−</button><button data-qty="1" aria-label="Більше">+</button></div></div>` : ''}
    ${it.status === 'want' ? `<button class="big go" data-set="have">✓ Придбано — у колекцію</button>` : `<button class="big back" data-set="want">Перенести в «Хочу придбати»</button>`}
    <button class="big plain" data-edit>Редагувати</button>
    <button class="big plain" data-remove style="color:var(--tint)">Видалити</button>`;
  $('#ov').dataset.id = id; $('#ov').hidden = false;
}
const closeSheet = () => { $('#ov').hidden = true; $('#ov').dataset.id = ''; ui.side = 'front'; };
$('#ovBg').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeSheet(); });

/* ---------- додавання та редагування ---------- */
let draft = null, imgResults = [];
function openForm(it){
  draft = it ? Object.assign({}, it) : { id: 'c' + Date.now().toString(36), status: ui.tab, name:'', country:'Україна', year:'', nominal:'', metal:'', weight:'', diameter:'', mintage:'', series:'', history:'', img:'', imgBack:'', imgSource:'', qty: ui.tab === 'have' ? 1 : 0, note:'' };
  const f = (k, label, type='text', ph='') => `<label><span>${label}</span><input data-f="${k}" type="${type}" value="${esc(draft[k])}" placeholder="${esc(ph)}" ${type==='text'?'autocomplete="off"':''}></label>`;
  $('#sheet').setAttribute('aria-label', it ? 'Редагувати монету' : 'Нова монета');
  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <div class="row"><button class="done" data-close style="font-weight:400">Скасувати</button><span style="font-size:17px;font-weight:600">${it ? 'Редагувати' : 'Нова монета'}</span><button class="done" data-save>Зберегти</button></div>
    <div class="form">
      ${f('name','Назва','text','напр. Пам\'ятна монета «…»')}
      <label><span>Список</span><select data-f="status"><option value="have" ${draft.status==='have'?'selected':''}>Колекція</option><option value="want" ${draft.status==='want'?'selected':''}>Хочу придбати</option></select></label>
      ${f('country','Країна')}${f('year','Рік','text','2024')}${f('nominal','Номінал','text','10 гривень')}${f('series','Серія')}
    </div>
    <div class="form">${f('metal','Метал','text','нейзильбер')}${f('weight','Маса','text','12,8 г')}${f('diameter','Діаметр','text','31 мм')}${f('mintage','Тираж','text','75 000')}</div>
    <div class="form"><label style="align-items:flex-start"><span style="padding-top:12px">Історія</span><textarea data-f="history" placeholder="Коротко про монету">${esc(draft.history)}</textarea></label>
      <label style="align-items:flex-start"><span style="padding-top:12px">Нотатка</span><textarea data-f="note" placeholder="Де купив, стан, ціна…" style="min-height:60px">${esc(draft.note)}</textarea></label></div>
    <div class="box"><h3>Зображення</h3>
      <p class="hint" style="margin-bottom:10px">Знайду рендери у відкритих джерелах за назвою — вибери потрібне. Або встав посилання на зображення вручну.</p>
      <button class="big back" data-findimg style="width:100%;min-height:44px;font-size:15px">Знайти зображення</button>
      <div class="pick" id="pick" style="margin-top:10px"></div>
      <div class="form" style="margin-top:10px;background:var(--fill)">${f('img','Аверс URL','url','https://…')}${f('imgBack','Реверс URL','url','https://…')}</div>
    </div>`;
  $('#ov').dataset.id = ''; $('#ov').hidden = false;
  $('#sheet').querySelectorAll('[data-f]').forEach(el => el.addEventListener('input', () => { draft[el.dataset.f] = el.value; }));
  if (!it) setTimeout(() => $('[data-f=name]').focus(), 60);
}
async function findImages(){
  const q = [draft.name, draft.year, draft.country === 'Україна' ? 'coin Ukraine' : 'coin'].filter(Boolean).join(' ');
  const box = $('#pick'); if (!box) return;
  if (!draft.name.trim()) { box.innerHTML = '<span class="hint">Спершу введи назву</span>'; return; }
  box.innerHTML = '<span class="hint">Шукаю…</span>';
  try {
    const url = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=16&gsrsearch=${encodeURIComponent(q)}&prop=imageinfo&iiprop=url&iiurlwidth=400`;
    const r = await fetch(url); const d = await r.json();
    imgResults = Object.values((d.query||{}).pages||{}).sort((a,b)=>a.index-b.index).map(p => p.imageinfo && p.imageinfo[0]).filter(Boolean).filter(ii => /\.(png|jpe?g|webp)$/i.test(ii.url)).map(ii => ({ thumb: ii.thumburl || ii.url, page: ii.descriptionurl }));
    box.innerHTML = imgResults.length ? imgResults.map((x,i) => `<button data-pickimg="${i}" aria-pressed="${draft.img === x.thumb}" aria-label="Зображення ${i+1}"><img alt="" referrerpolicy="no-referrer" src="${esc(x.thumb)}"></button>`).join('') : '<span class="hint">Нічого не знайдено — спробуй іншу назву або встав посилання вручну.</span>';
  } catch(e) { box.innerHTML = '<span class="hint">Не вдалося з\'єднатися з Wikimedia Commons</span>'; }
}
function saveDraft(){
  if (!draft.name.trim()) { toast('Введи назву монети'); return; }
  const exists = byId(draft.id);
  mutate(() => {
    if (draft.status === 'have' && !draft.qty) draft.qty = 1;
    if (exists) Object.assign(exists, draft); else items.unshift(Object.assign(draft, { added: Date.now() }));
  }, exists ? 'Збережено' : `«${draft.name}» додано`);
  ui.tab = draft.status; save(); render();
  if (exists) openSheet(draft.id); else closeSheet();
}

/* ---------- події ---------- */
$('#btnAdd').onclick = () => openForm(null);
$('#q').addEventListener('input', e => { ui.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { ui.sort = e.target.value; save(); render(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = $('#ov').dataset.id, it = id && byId(id);
  if (b.dataset.tab) { ui.tab = b.dataset.tab; save(); render(); }
  else if (b.dataset.open) openSheet(b.dataset.open);
  else if (b.dataset.buy) setStatus(b.dataset.buy, 'have');
  else if (b.dataset.close !== undefined) closeSheet();
  else if (b.dataset.set && it) setStatus(id, b.dataset.set);
  else if (b.dataset.qty && it) { const n = (Number(it.qty) || 1) + Number(b.dataset.qty); if (n < 1) return; mutate(() => { it.qty = n; }); }
  else if (b.dataset.side && it) { ui.side = b.dataset.side; openSheet(id); }
  else if (b.dataset.edit !== undefined && it) openForm(it);
  else if (b.dataset.remove !== undefined && it) { mutate(() => { items = items.filter(i => i.id !== id); removed.push(id); store.set('coins.removed', removed); }, `«${it.name}» видалено`); closeSheet(); }
  else if (b.dataset.findimg !== undefined) findImages();
  else if (b.dataset.pickimg !== undefined) { const x = imgResults[Number(b.dataset.pickimg)]; draft.img = x.thumb; draft.imgSource = 'Wikimedia Commons'; const inp = $('[data-f=img]'); if (inp) inp.value = x.thumb; document.querySelectorAll('[data-pickimg]').forEach(el => el.setAttribute('aria-pressed', el === b)); }
  else if (b.dataset.save !== undefined) saveDraft();
});

render();
}
</script>
